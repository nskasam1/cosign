<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The app name alone, on purpose: this document is every route, so the
         only honest static title is the one that is true of all of them. Each
         screen names itself at runtime through src/lib/title.ts. -->
    <title>Cosign</title>
    <meta name="description" content="Ranked recommendations from people you trust." />

    <meta property="og:title" content="Cosign" />
    <meta property="og:description" content="Ranked recommendations from people you trust." />
    <meta property="og:type" content="website" />

    <!-- Favicons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/app-icon.png" />

    <!-- PWA / iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cosign" />
    <!-- The design system's ground (--bg in src/design/tokens.css), which the
         SSR pages have carried since Phase 2. This said #141618 — the
         pre-token palette — for four phases, so the phone's status bar sat a
         visibly cooler grey against a warm page. tokens.test.ts guards it. -->
    <meta name="theme-color" content="#14100E" />
    <link rel="manifest" href="/manifest.json" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
